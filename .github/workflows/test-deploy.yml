name: Test deployment

on: push

jobs:
  test-deploy:
    name: Test deployment to GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
      - name: Build website
        run: npm run build
